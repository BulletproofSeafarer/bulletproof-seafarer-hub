name: Toolbox Development Tests
on:
  push:
    branches: [toolbox-2-development]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full automated test suite
        run: npm test

name: Toolbox Development Tests
on:
  push:
    branches: [toolbox-2-development]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check isolated vault modules
        run: |
          node --check dist/toolbox-vault-crypto.cjs
          node --check dist/toolbox-vault-staging.cjs
          node --check dist/toolbox-vault-indexeddb.cjs
          node --check dist/toolbox-migration-preflight.cjs
          node --check dist/toolbox-attachment-preflight.cjs
      - name: Run full automated test suite
        run: npm test

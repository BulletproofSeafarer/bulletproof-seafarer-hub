{id:'demo1',title:'Purifier vibration after maintenance — what details should I include?',body:'We noticed a change in vibration following maintenance. I want to describe the situation clearly before discussing it with the responsible engineer. What equipment details and observations would make this question more useful?',dept:'Engine',equipment:'Purifier',tags:['Vibration','Maintenance'],author:'Marco D.',role:'Engine crew · demo',status:'Open',time:'25 min ago',answers:[{id:'a1',name:'Paolo R.',text:'Include the exact maker and model, the maintenance work recorded, when the observation appeared, and any alarm text. Share readings only if they can be obtained safely under your onboard procedures. A photo of the equipment label can help, with confidential details hidden.',basis:'Suggested documentation',help:4}],photos:[]},
{id:'demo2',title:'Fresh water generator: organizing a useful vacuum-loss report',body:'Our discussion kept getting split between messages. This example shows how one question can keep the observations, follow-up questions, and reported outcome together. Fictional case for interface demonstration only.',dept:'Engine',equipment:'Fresh Water Generator',tags:['FWG','Vacuum','Case study'],author:'Leo M.',role:'Marine engineer · demo',status:'Resolved',time:'1 hour ago',answers:[{id:'a2',name:'Ramon C.',text:'Keep a timeline of the observation and the operating conditions together. Refer the technical assessment to the responsible engineer and the equipment manual; a chat photo alone cannot establish the cause.',basis:'Suggested documentation',help:8}],outcome:'Demo outcome: the asker consolidated the observations into one report and referred the technical issue through the vessel’s onboard process. No cause or repair is asserted in this fictional example.',photos:[]},
{id:'demo3',title:'What should I include in a recurring deck machinery finding?',body:'I want future crew to understand a recurring maintenance observation without searching through weeks of messages. How do you structure the handover entry?',dept:'Deck',equipment:'Deck Machinery',tags:['Handover','Maintenance'],author:'Anne S.',role:'Deck officer · demo',status:'Open',time:'2 hours ago',answers:[],photos:[]},
{id:'demo4',title:'How do you label pump photos so the next crew can understand them?',body:'We have several similar units. I am looking for a consistent way to connect a photo with the equipment identification and the written observation, without sharing sensitive vessel information.',dept:'Engine',equipment:'Pumps',tags:['Photos','Handover'],author:'Chris B.',role:'Engine crew · demo',status:'Open',time:'3 hours ago',answers:[],photos:[]},
{id:'demo5',title:'Keeping alarm text and equipment details in one electrical question',body:'What is the clearest format for documenting the exact alarm wording, equipment model, and when it appeared? This is about writing a useful question, not a request for live operating instructions.',dept:'Electrical',equipment:'Electrical',tags:['Alarms','Documentation'],author:'Dan P.',role:'ETO · demo',status:'Open',time:'Yesterday',answers:[],photos:[]}

let state;try{if(!window.HubRuntime?.enabled)state=JSON.parse(localStorage.getItem('crewanswers-v1'))}catch{}state=state||{questions:[],saved:[],followed:['Purifier','Fresh Water Generator'],votes:[],read:[]};
let page='home',topic='All topics',query='',sort='recent',selected=null,photos=[],answerPhotos=[];
let all=()=>[...state.questions,...seed.filter(q=>!state.questions.some(local=>local.id===q.id))];const app=document.querySelector('#app');
function persist(){if(globalThis.HubRuntime?.enabled)return globalThis.HubRuntime.cacheLocal();try{localStorage.setItem('crewanswers-v1',JSON.stringify(state));return true}catch{toast('Storage is full. Remove photos or use smaller images; your entry has not been saved.');return false}}

function filtered(){const words=query.toLowerCase().replace(/\bfwg\b/g,'fresh water generator').split(/\s+/).filter(Boolean);let list=all().filter(q=>(topic==='All topics'||q.equipment===topic)&&words.every(w=>(q.title+' '+q.body+' '+q.equipment+' '+q.tags.join(' ')+' '+q.answers.map(a=>a.text).join(' ')).toLowerCase().includes(w)));if(sort==='unanswered')list=list.filter(q=>!q.answers.length);if(sort==='resolved')list=list.filter(q=>q.status==='Resolved');if(sort==='followed')list=list.filter(q=>state.followed.includes(q.equipment));return list}
function results(){const list=filtered();document.querySelector('#results').innerHTML=list.length?list.map(card).join(''):`<div class="empty">No questions match yet.<p>Try a broader term, or start the discussion.</p><button class="btn" data-nav="ask">Ask a question</button></div>`;document.querySelector('#resultCount').textContent=list.length+' questions'}
function board(){app.innerHTML=`${page==='home'?`<section class="hero"><div><div class="eyebrow">Experience shared. Knowledge kept.</div><h1>Good answers shouldn’t<br>get lost at sea.</h1><p>Ask the crew. Share what you know. Find the experience you need, without the endless backreading.</p><button class="btn gold" data-nav="ask">${icon('ask')} Ask the community ${icon('arrow')}</button></div><div class="hero-symbol" aria-hidden="true">⚓</div></section>`:`<h1 class="page-title">Find the knowledge you need.</h1><p class="subtitle">Explore the crew’s questions, observations, and reported outcomes.</p>`}<label class="search">${icon('search')}<input id="search" type="search" placeholder="Search equipment, symptoms, or questions…" value="${esc(query)}" aria-label="Search questions"><span>SEARCH THE KNOWLEDGE</span></label><div class="chips">${equipment.map(t=>`<button class="chip ${topic===t?'active':''}" data-topic="${t}">${t}</button>`).join('')}</div><div class="columns"><section><div class="section-heading"><h2>From the community <small id="resultCount" style="font-size:11px;color:var(--muted);font-weight:400"></small></h2><select id="sort" aria-label="Filter discussions"><option value="recent">Latest discussions</option><option value="unanswered">Unanswered</option><option value="resolved">Resolved cases</option><option value="followed">Following</option></select></div><div id="results"></div></section><aside class="aside"><div class="card"><h2 class="aside-title">YOUR ENGINE-ROOM SHELF</h2>${['Purifier','Fresh Water Generator','Main Engine','Pumps'].map(t=>`<div class="topic"><span>${t}</span><button data-follow="${t}">${state.followed.includes(t)?'Following':'＋ Follow'}</button></div>`).join('')}</div><div class="note"><span class="eyebrow">Better questions. Better learning.</span><strong style="margin-top:10px">Show the detail.<br>Tell the full story.</strong>Add equipment details, what you observed, and a photo when safe and permitted.<p><button class="text-button" data-lesson="0">Read the question guide →</button></p></div><p class="safety">Fictional sample discussions. Community experience supports learning—not emergency response. Follow vessel procedures, manuals, and responsible officers.</p></aside></div>`;document.querySelector('#sort').value=sort;results();document.querySelector('#search').oninput=e=>{query=e.target.value;results()};document.querySelector('#sort').onchange=e=>{sort=e.target.value;results()}}
function photoGrid(list,remove=false,kind='question'){return `<div class="photos">${list.map((p,i)=>`<div class="photo"><img src="${esc(p)}" alt="${kind} attachment ${i+1}" data-zoom="${i}" data-kind="${kind}" tabindex="0">${remove?`<button type="button" data-remove="${i}" aria-label="Remove photo ${i+1}">×</button>`:''}</div>`).join('')}</div>`}
function questionDraftKey(){return globalThis.HubRuntime?.draftKey?.()||'crew-draft'}
function ask(){let draft={};try{draft=JSON.parse(sessionStorage.getItem(questionDraftKey()))||{}}catch{}app.innerHTML=`<h1 class="page-title">Ask the crew.</h1><p class="subtitle">One clear question can become knowledge for the next seafarer.</p><div class="banner">Prototype mode · Questions and photos are saved only in this browser. Not sent to a live community.</div><form id="askForm" class="card" style="max-width:780px"><div class="eyebrow">Start with what you observed</div><label class="field">Question title<input required name="title" maxlength="160" placeholder="e.g. Purifier vibration after maintenance" value="${esc(draft.title||'')}"></label><div id="similar"></div><div class="two"><label class="field">Department<select name="dept"><option>Engine</option><option>Deck</option><option>Electrical</option><option>General Shipboard Knowledge</option></select></label><label class="field">Equipment<select name="equipment">${equipment.slice(1).map(t=>`<option>${t}</option>`).join('')}<option>Other equipment</option></select></label></div><label class="field">Describe the problem<textarea required name="body" placeholder="What happened? When did you notice it? What have you already checked? Include readings with units, if available.">${esc(draft.body||'')}</textarea></label><label class="field">Manufacturer / model <span class="hint">Optional — it’s okay if you don’t know.</span><input name="model" placeholder="Maker and model, if known" value="${esc(draft.model||'')}"></label><label class="field">Symptom tags <span class="hint">Optional, separated by commas.</span><input name="tags" placeholder="Vibration, alarm, maintenance…" value="${esc(draft.tags||'')}"></label><div class="field">Show the specific problem<span class="hint">Up to 5 photos. Use the camera or your photo library.</span></div><label class="upload">▧ Add photos of equipment, alarms, or observations<input type="file" accept="image/*" multiple id="photoInput"></label><div id="photoPreview">${photoGrid(photos,true)}</div><p class="hint">Take photos only when safe and permitted. Hide vessel, company, location, and personal information. This prototype does not provide a secure document vault.</p><label style="display:flex;gap:9px;font-size:12px;align-items:flex-start"><input type="checkbox" required style="margin-top:4px">I understand community replies do not replace onboard procedures, manuals, or responsible officers.</label><div class="form-actions"><span class="hint" id="draftStatus">Text draft stays in this browser tab.</span><button class="btn" type="submit">Post test question ${icon('arrow')}</button></div></form>`;const f=document.querySelector('#askForm');if(draft.dept)f.dept.value=draft.dept;if(draft.equipment)f.equipment.value=draft.equipment;f.oninput=()=>{try{sessionStorage.setItem(questionDraftKey(),JSON.stringify(Object.fromEntries(new FormData(f))));document.querySelector('#draftStatus').textContent='Text draft saved in this tab.'}catch{}const title=f.elements.namedItem('title').value.toLowerCase();const matches=all().filter(q=>title.length>8&&title.split(' ').filter(w=>w.length>4).some(w=>q.title.toLowerCase().includes(w))).slice(0,2);document.querySelector('#similar').innerHTML=matches.length?`<div class="similar"><b>Possibly related discussions</b>${matches.map(q=>`<p><button type="button" class="text-button" data-open="${q.id}">${esc(q.title)}</button></p>`).join('')}</div>`:''};document.querySelector('#photoInput').onchange=async e=>{await addPhotos(e.target.files,photos,5);document.querySelector('#photoPreview').innerHTML=photoGrid(photos,true);e.target.value=''};f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(!d.title.trim()||!d.body.trim()){toast('Add a title and a problem description.');return}const q={id:'q'+Date.now(),title:d.title.trim(),dept:d.dept,equipment:d.equipment,body:d.body.trim()+(d.model.trim()?'\n\nEquipment model: '+d.model.trim():''),tags:d.tags.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5),photos:[...photos],answers:[],author:'JV Ursal',role:'Learning companion',status:'Open',time:'Just now'};state.questions.unshift(q);if(!persist()){state.questions.shift();return}photos=[];sessionStorage.removeItem(questionDraftKey());selected=q.id;page='detail';render();toast('Test question saved in this browser.')}}
async function addPhotos(files,target,max){for(const file of Array.from(files)){if(target.length>=max){toast('Maximum '+max+' photos.');break}if(file.size>15*1024*1024){toast('Choose a photo under 15 MB.');continue}try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const compressed=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,1200/im.width,1200/im.height);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=data});target.push(compressed)}catch{toast('Could not open that image. Try JPEG, PNG, or WebP; HEIC support depends on your browser.')}}}
function detail(){const q=all().find(q=>q.id===selected);if(!q){nav('home');return}app.innerHTML=`<button class="back" data-nav="home">← Back to community</button><div class="banner">${q.id.startsWith('demo')?'Fictional demo discussion — not a real diagnosis or repair.':'Local test discussion — visible only in this browser.'}</div><article class="card detail"><div class="meta"><span class="status ${q.status==='Resolved'?'resolved':''}">${q.status==='Resolved'?'✓ Resolved · reported by asker':'● Open question'}</span><span>${esc(q.dept)} · ${esc(q.time)}</span></div><h1>${esc(q.title)}</h1><div class="meta">${esc(q.author)} · ${esc(q.role)}</div><p class="body">${esc(q.body)}</p>${photoGrid(q.photos)}<div class="tags"><span class="tag">${esc(q.equipment)}</span>${q.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${q.outcome?`<div class="outcome"><strong>Reported outcome</strong>${esc(q.outcome)}<p class="hint">Reported by the asker. Not independently verified or universally applicable.</p></div>`:''}<div class="cardfoot"><button class="save ${state.saved.includes(q.id)?'on':''}" data-save="${q.id}">${icon('save')}${state.saved.includes(q.id)?'Saved':'Save question'}</button>${own(q)?`<button class="text-button" id="resolve">${q.status==='Resolved'?'Reopen question':'Record an outcome'}</button>`:''}</div><p class="safety">Follow vessel procedures, equipment manuals, and responsible officers. Community replies may be incomplete or unsuitable for your equipment. Not an emergency response channel.</p></article><section class="answers"><h2>${q.answers.length} answer${q.answers.length===1?'':'s'}</h2>${q.answers.map((a,i)=>`<article class="card"><div class="answer-meta"><div class="avatar">${esc(a.name.slice(0,1))}</div><div><b>${esc(a.name)}</b><small>${esc(a.basis||'Community contribution')}</small></div></div><p style="font-size:14px;white-space:pre-wrap">${esc(a.text)}</p>${photoGrid(a.photos||[],false,'answer-'+i)}<div class="cardfoot"><button class="text-button" data-vote="${a.id}">${state.votes.includes(a.id)?'✓ Marked helpful':'↑ Helpful'} · ${(a.help||0)+(state.votes.includes(a.id)?1:0)}</button>${q.accepted===a.id?'<span class="status resolved">Accepted by asker · not verified</span>':own(q)?`<button class="text-button" data-accept="${a.id}">Accept answer</button>`:''}</div></article>`).join('')||'<p class="subtitle">No answers yet. Be the first to contribute useful context.</p>'}<form class="card" id="answerForm"><h3 style="margin-top:0">Share your experience</h3><label class="field">Your answer<textarea name="text" required placeholder="Explain your observation, relevant conditions, and limitations. Avoid guessing a diagnosis."></textarea></label><label class="field">Basis<select name="basis"><option>Firsthand experience</option><option>Manual or reference</option><option>Suggested explanation</option></select></label><label class="field">Attach photos (optional, up to 3)<input id="answerFiles" type="file" accept="image/*" multiple></label><div id="answerPreview"></div><button class="btn">Post test answer</button><p class="hint">Saved to this browser only.</p></form></section>`;document.querySelector('#answerFiles').onchange=async e=>{await addPhotos(e.target.files,answerPhotos,3);document.querySelector('#answerPreview').innerHTML=photoGrid(answerPhotos,true,'draft-answer');e.target.value=''};document.querySelector('#answerForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);if(!d.get('text').trim())return;const answer={id:'a'+Date.now(),name:'JV Ursal',text:d.get('text').trim(),basis:d.get('basis'),photos:[...answerPhotos],help:0};mutateQ(q,x=>x.answers.push(answer));answerPhotos=[];render();toast('Test answer saved locally.')};const res=document.querySelector('#resolve');if(res)res.onclick=()=>{if(q.status==='Resolved'){mutateQ(q,x=>{x.status='Open';delete x.outcome});render();return}document.querySelector('#answerForm').insertAdjacentHTML('beforebegin','<form class="card" id="outcomeForm"><h3>Record the reported outcome</h3><p class="hint">Describe observations, action, results, and conditions. Do not include confidential information.</p><label class="field">What happened?<textarea name="outcome" required></textarea></label><button class="btn">Save outcome</button></form>');document.querySelector('#outcomeForm').scrollIntoView({behavior:'smooth'});res.disabled=true;document.querySelector('#outcomeForm').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('outcome').trim();if(!text)return;mutateQ(q,x=>{x.status='Resolved';x.outcome=text});render()}}}
function mutateQ(q,fn){const original=JSON.parse(JSON.stringify(state.questions));let local=state.questions.find(x=>x.id===q.id);if(!local){local=JSON.parse(JSON.stringify(q));state.questions.push(local)}fn(local);if(!persist()){state.questions=original;return false}return true}
const lessons=[{title:'Write a question the crew can actually answer',cat:'COMMUNITY ESSENTIALS',time:'4 min read',symbol:'◎',intro:'Give people enough context to understand your observation, without making them guess.',steps:[['Start with the equipment','State the department, equipment category, and maker or model if known. “I don’t know” is better than an invented detail.'],['Describe what you observed','Separate observations from guesses. Include the exact alarm text and units with readings. Explain when the issue appeared.'],['Keep the discussion together','Add follow-up observations to the same question. Share only information you are permitted to disclose.'],['Close the loop','Return with the reported outcome and relevant conditions. That is how a discussion becomes useful to the next crew.']]},{title:'A photo helps. Context makes it useful.',cat:'BETTER DOCUMENTATION',time:'3 min read',symbol:'▧',intro:'A photo can show a detail. It cannot establish the full operating conditions or prove a cause.',steps:[['Safety comes first','Take photos only when safe and permitted onboard. Never approach a hazard or interrupt safe work to capture an image.'],['Show what matters','Use an overview and a detail image when appropriate. Make labels readable, but hide confidential vessel, company, location, and personal details.'],['Connect it to your description','Explain what the reader should notice. State when the photo was taken and how it relates to your written observation.']]},{title:'From scattered messages to a reusable case',cat:'CASE STUDY · DEMO',time:'3 min read',symbol:'↗',intro:'A fictional example of documenting a fresh water generator discussion—not a technical repair guide.',steps:[['The original difficulty','Observations were scattered across separate messages. Later readers could not tell which conditions applied to which update.'],['The documentation outcome','The sample asker consolidated the observations and referred the equipment issue through the vessel’s onboard process. No repair is asserted.'],['The lesson','Keep one question, preserve follow-ups, and label the asker’s reported outcome separately from community suggestions.']]}];
function learn(){app.innerHTML=`<h1 class="page-title">Experience becomes knowledge.</h1><p class="subtitle">Short guides and case studies you can return to—one useful lesson at a time.</p><div class="banner">Prototype learning library · Editorial sample guides, not operational instructions or certification.</div><div class="lesson-grid">${lessons.map((l,i)=>`<article class="card lesson"><div class="lesson-art"><small>CREW / FIELD NOTES<br>0${i+1}</small><span>${l.symbol}</span></div><div class="lesson-content"><div class="eyebrow" style="color:var(--teal);font-size:9px">${l.cat}</div><h3>${l.title}</h3><p>${l.intro}</p><div class="section-heading"><span class="hint">${l.time}${state.read.includes(i)?' · ✓ Read':''}</span><button class="text-button" data-lesson="${i}">Read guide →</button></div></div></article>`).join('')}</div>`}
function lesson(i){const l=lessons[i];page='lesson';selected=i;renderNav();app.innerHTML=`<button class="back" data-nav="learn">← Back to learning library</button><article class="card read-content"><div class="eyebrow" style="color:var(--teal)">${l.cat}</div><h1 class="page-title" style="margin-top:15px">${l.title}</h1><p class="subtitle">${l.time} · Toolbox editorial sample</p><p>${l.intro}</p>${l.steps.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join('')}${i===2?'<button class="text-button" data-open="demo2">View original demo discussion →</button>':''}<p class="safety">For learning and documentation. Follow your vessel’s procedures and responsible officers.</p><button class="btn" data-read="${i}">${state.read.includes(i)?'✓ Marked as read':'Mark as read'}</button></article>`;window.scrollTo(0,0)}
function profile(){app.innerHTML=`<div class="profile-head"><div class="avatar">JV</div><div><h2>JV Ursal</h2><span class="hint">Learning companion · No live account connected</span></div></div><div class="statrow"><div class="stat"><b>${state.questions.filter(q=>q.author==='JV Ursal').length}</b><small>My test questions</small></div><div class="stat"><b>${state.saved.length}</b><small>Saved questions</small></div><div class="stat"><b>${state.read.length}</b><small>Guides read</small></div></div><div class="card"><h3 style="margin-top:0">Following</h3><div class="chips">${equipment.slice(1).map(t=>`<button class="chip ${state.followed.includes(t)?'active':''}" data-follow="${t}">${state.followed.includes(t)?'✓ ': '＋ '}${t}</button>`).join('')}</div></div><h3>Saved for later</h3>${all().filter(q=>state.saved.includes(q.id)).map(card).join('')||'<p class="subtitle">Save a question to build your own knowledge shelf.</p>'}<h3>My test questions</h3>${state.questions.filter(q=>q.author==='JV Ursal').map(card).join('')||'<p class="subtitle">Your test questions will appear here.</p>'}<div class="note"><strong>This is a local prototype.</strong>Questions, answers, photos, bookmarks, and followed tags stay in this browser. There is no shared community, live authentication, or cross-device sync yet. Clearing browser data removes test entries.</div>`}
function render(){renderNav();document.querySelector('#sectionName').textContent=({home:'Community board',explore:'Explore knowledge',ask:'Ask a question',learn:'Learning library',profile:'Your knowledge shelf',detail:'Community discussion'})[page]||'Learning library';if(page==='home'||page==='explore')board();if(page==='ask')ask();if(page==='detail')detail();if(page==='learn')learn();if(page==='profile')profile()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.nav){nav(b.dataset.nav);return}if(b?.dataset.topic){topic=b.dataset.topic;render();return}if(b?.dataset.open){selected=b.dataset.open;page='detail';answerPhotos=[];render();window.scrollTo(0,0);return}if(b?.dataset.save){const id=b.dataset.save;const prev=[...state.saved];state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];if(!persist())state.saved=prev;render();return}if(b?.dataset.follow){const t=b.dataset.follow;const prev=[...state.followed];state.followed=state.followed.includes(t)?state.followed.filter(x=>x!==t):[...state.followed,t];if(!persist())state.followed=prev;render();return}if(b?.dataset.lesson!==undefined){lesson(Number(b.dataset.lesson));return}if(b?.dataset.read!==undefined){const i=Number(b.dataset.read);if(!state.read.includes(i)){state.read.push(i);persist()}lesson(i);return}if(b?.dataset.vote){const id=b.dataset.vote;const prev=[...state.votes];state.votes=state.votes.includes(id)?state.votes.filter(x=>x!==id):[...state.votes,id];if(!persist())state.votes=prev;render();return}if(b?.dataset.accept){const q=all().find(x=>x.id===selected);mutateQ(q,x=>x.accepted=b.dataset.accept);render();return}if(b?.dataset.remove!==undefined){const i=Number(b.dataset.remove);if(page==='ask'){photos.splice(i,1);document.querySelector('#photoPreview').innerHTML=photoGrid(photos,true)}else{answerPhotos.splice(i,1);document.querySelector('#answerPreview').innerHTML=photoGrid(answerPhotos,true,'draft-answer')}return}const img=e.target.closest('[data-zoom]');if(img){document.querySelector('#largePhoto').src=img.src;document.querySelector('#lightbox').classList.remove('hidden');document.querySelector('#closePhoto').focus()}});
document.querySelector('#closePhoto').onclick=()=>document.querySelector('#lightbox').classList.add('hidden');document.querySelector('#lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#lightbox').classList.add('hidden');if(e.key==='Enter'&&e.target.matches('[data-zoom]'))e.target.click()});render();
